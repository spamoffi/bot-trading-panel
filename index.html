<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panel del bot</title>
<meta name="description" content="Panel de solo lectura del bot de David: cartera de práctica en ETF y laboratorio de acciones y cripto con dinero ficticio. Cada operación, con su motivo.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f55d4'/%3E%3Cpath d='M7 21l6-6 4 4 8-9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f3; --line: #e2e5ea; --line-2: #eceef2;
  --ink: #15181d; --ink-2: #474f5b; --ink-3: #626a77;
  --accent: #2f55d4; --accent-ink: #ffffff; --accent-soft: #e8edfc;
  --up: #157a4a; --up-soft: #e3f3ea; --down: #be3329; --down-soft: #fbe9e7;
  --sim: #835600; --sim-soft: #fbf0d9; --ref: #8c93a0;
  --shadow: 0 1px 2px rgba(21, 30, 45, .05), 0 14px 32px -18px rgba(21, 30, 45, .18);
  --r-lg: 18px; --r-md: 12px; --r-sm: 7px;
  --font: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  --nav-h: 64px; --ease: cubic-bezier(.16, 1, .3, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #171a20; --surface-2: #1f232b; --line: #2b3039; --line-2: #22262e;
    --ink: #e9ecf1; --ink-2: #b6bdc9; --ink-3: #939bab;
    --accent: #8fa7ff; --accent-ink: #0f1115; --accent-soft: #1f2843;
    --up: #56c78f; --up-soft: #15291f; --down: #f28c82; --down-soft: #34191a;
    --sim: #ebbd5f; --sim-soft: #31260f; --ref: #7d8594;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 32px -18px rgba(0, 0, 0, .7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a20; --surface-2: #1f232b; --line: #2b3039; --line-2: #22262e;
  --ink: #e9ecf1; --ink-2: #b6bdc9; --ink-3: #939bab;
  --accent: #8fa7ff; --accent-ink: #0f1115; --accent-soft: #1f2843;
  --up: #56c78f; --up-soft: #15291f; --down: #f28c82; --down-soft: #34191a;
  --sim: #ebbd5f; --sim-soft: #31260f; --ref: #7d8594;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 14px 32px -18px rgba(0, 0, 0, .7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--font);
  -webkit-font-smoothing: antialiased; min-height: 100dvh; caret-color: var(--accent);
}
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
* { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.015em; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.salto { position: absolute; left: -999px; top: 8px; z-index: 100; background: var(--surface); color: var(--ink); padding: 10px 14px; border-radius: 10px; }
.salto:focus { left: 12px; }
svg.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- cabecera ---------- */
.cabecera { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(12px) saturate(1.3); border-bottom: 1px solid var(--line-2); }
.cab-in { max-width: 1160px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; min-height: 60px; }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
.marca .logo { width: 30px; height: 30px; border-radius: 9px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.marca .logo svg { width: 18px; height: 18px; stroke-width: 2.4; }
.frescura { color: var(--ink-3); font-size: 13.5px; margin-left: auto; white-space: nowrap; }
.boton {
  font: 500 14px var(--font); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px;
  cursor: pointer; touch-action: manipulation; transition: background .2s, transform .15s var(--ease);
}
.boton:hover { background: var(--surface-2); }
.boton:active { transform: translateY(1px) scale(.98); }
.boton[aria-busy="true"] svg { animation: girar 1s linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }

/* ---------- navegación: arriba en escritorio, abajo en móvil ---------- */
.nav { background: var(--surface); }
.nav-in { max-width: 1160px; margin: 0 auto; display: flex; gap: 4px; padding: 0 12px; }
.nav a {
  display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14.5px;
  min-height: 48px; padding: 0 12px; border-bottom: 2px solid transparent; transition: color .2s, border-color .2s;
}
.nav a:hover { color: var(--ink); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.nav a[aria-current="page"] svg { color: var(--accent); }
@media (min-width: 761px) { .nav { position: sticky; top: 61px; z-index: 19; border-bottom: 1px solid var(--line); } }
@media (max-width: 760px) {
  .frescura { display: none; }
  .boton .txt { display: none; }
  #recargar { margin-left: auto; width: 44px; justify-content: center; padding: 0; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -8px 24px -18px rgba(0,0,0,.25); }
  .nav-in { padding: 0; gap: 0; }
  .nav a { flex: 1; flex-direction: column; gap: 3px; justify-content: center; font-size: 11.5px; min-height: var(--nav-h); padding: 6px 2px; border-bottom: 0; border-top: 2px solid transparent; }
  .nav a[aria-current="page"] { border-top-color: var(--accent); }
  body { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); }
}

/* ---------- vistas ---------- */
main { max-width: 1160px; margin: 0 auto; padding: 28px 16px 72px; }
.vista[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) {
  .vista { animation: entrar .32s var(--ease); }
  @keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
.apertura { display: grid; gap: 22px; padding: 6px 0 30px; }
@media (min-width: 900px) { .apertura.con-lado { grid-template-columns: minmax(0, 1fr) 340px; align-items: end; gap: 40px; } }
.titular { font-size: clamp(28px, 4.6vw, 44px); line-height: 1.08; letter-spacing: -.035em; font-weight: 600; max-width: 20ch; }
.entradilla { color: var(--ink-2); font-size: 17px; max-width: 62ch; margin-top: 14px; }
.etiquetas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.etq { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; padding: 4px 9px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--ink-2); }
.etq svg.ico { width: 15px; height: 15px; }
.etq.sim { background: var(--sim-soft); color: var(--sim); }
.etq.ok { background: var(--up-soft); color: var(--up); }
.etq.mal { background: var(--down-soft); color: var(--down); }
.etq.acento { background: var(--accent-soft); color: var(--accent); }

section.bloque { margin-top: 36px; }
section.bloque > h2 { font-size: 21px; letter-spacing: -.025em; font-weight: 600; }
section.bloque > .explica { color: var(--ink-2); margin: 6px 0 16px; max-width: 66ch; font-size: 15.5px; }
.superficie { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); min-width: 0; }
.relleno { padding: 20px; }
@media (max-width: 520px) { .relleno { padding: 16px; } }
.superficie h3 { font-size: 15.5px; font-weight: 600; letter-spacing: -.01em; margin-bottom: 12px; }
.dos { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .dos { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); } .dos.mitad { grid-template-columns: 1fr 1fr; } }

/* datos clave al lado del titular */
.datos { margin: 0; display: grid; grid-template-columns: 1fr auto; column-gap: 16px; row-gap: 0; }
.datos dt, .datos dd { padding: 11px 0; border-bottom: 1px solid var(--line-2); margin: 0; }
.datos dt { color: var(--ink-2); font-size: 14.5px; }
.datos dd { text-align: right; font-size: 15px; }
.datos > :nth-last-child(-n+2) { border-bottom: 0; }

/* filas de carteras en el resumen */
.carteras { list-style: none; margin: 0; padding: 0; }
.carteras li + li { border-top: 1px solid var(--line-2); }
.cartera {
  display: grid; grid-template-columns: 40px minmax(0, 1fr) auto 20px; gap: 14px; align-items: center;
  padding: 18px 20px; color: inherit; text-decoration: none; transition: background .2s;
}
.cartera:hover { background: var(--surface-2); }
.cartera:active { background: var(--line-2); }
.cartera .icono { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); }
.cartera .nombre { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.cartera .que { color: var(--ink-2); font-size: 14.5px; margin-top: 2px; }
.cartera .cifra { text-align: right; }
.cartera .cifra .v { font-size: 16px; font-weight: 500; }
.cartera .cifra .c { font-size: 13.5px; }
.cartera > svg.ico { color: var(--ink-3); }
@media (max-width: 520px) {
  .cartera { grid-template-columns: 36px minmax(0, 1fr) 16px; padding: 16px; gap: 12px; }
  .cartera .icono { width: 36px; height: 36px; }
  .cartera .cifra { grid-column: 2; text-align: left; display: flex; gap: 10px; align-items: baseline; }
  .cartera > svg.ico { grid-row: 1; grid-column: 3; }
}

/* calendario */
.agenda { list-style: none; margin: 0; padding: 0; }
.agenda li { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 14px; padding: 13px 0; border-top: 1px solid var(--line-2); }
.agenda li:first-child { border-top: 0; padding-top: 0; }
.agenda .cuando { font-size: 14px; color: var(--ink); font-weight: 500; }
.agenda .cuando span { display: block; color: var(--ink-3); font-weight: 400; font-size: 13px; }
.agenda .que { font-size: 15px; color: var(--ink-2); }
.agenda .que strong { color: var(--ink); font-weight: 600; }

.lista { list-style: none; margin: 0; padding: 0; }
.lista li { padding: 12px 0; border-top: 1px solid var(--line-2); display: grid; gap: 3px; }
.lista li:first-child { border-top: 0; padding-top: 0; }
.lista .meta { color: var(--ink-3); font-size: 13px; }
.lista a { overflow-wrap: anywhere; }
.salud { display: grid; gap: 12px; }
.salud p { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.salud svg.ico { margin-top: 2px; }
.salud .bien { color: var(--up); } .salud .mal { color: var(--down); } .salud .neutro { color: var(--ink-3); }

/* señal de la estrategia */
.senal { display: grid; gap: 0; }
.senal .fila { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line-2); }
.senal .fila:first-child { border-top: 0; padding-top: 0; }
.senal .regla { font-size: 14.5px; color: var(--ink-2); }
.senal .fila > span:nth-child(2) { display: grid; }
.medidor { display: block; height: 8px; border-radius: 99px; background: var(--surface-2); position: relative; margin-top: 6px; }
.medidor span { position: absolute; top: 0; bottom: 0; left: 50%; border-radius: 99px; }
.medidor i { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--ink-3); }

.peso { display: grid; grid-template-columns: 76px minmax(0, 1fr) 64px; gap: 12px; align-items: center; padding: 8px 0; font-size: 14.5px; }
.peso .barra { height: 8px; border-radius: 99px; background: var(--surface-2); position: relative; overflow: hidden; }
.peso .barra span { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.peso .barra em { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }

/* gráfico */
.grafico { position: relative; }
.grafico svg.g { display: block; width: 100%; height: auto; overflow: visible; }
.grafico .eje { stroke: var(--line-2); stroke-width: 1; }
.grafico .etiq { fill: var(--ink-3); font: 11px var(--mono); }
.grafico .linea { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.grafico .linea.ref { stroke: var(--ref); stroke-width: 1.5; stroke-dasharray: 4 4; }
.grafico .area { fill: var(--accent); opacity: .08; }
.grafico .guia { stroke: var(--ink-3); stroke-width: 1; }
.grafico .punto { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
@media (prefers-reduced-motion: no-preference) {
  .grafico .linea.dibujar { stroke-dasharray: var(--l); stroke-dashoffset: var(--l); animation: trazo 1.2s var(--ease) forwards; }
  @keyframes trazo { to { stroke-dashoffset: 0; } }
}
.bocadillo { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -115%); opacity: 0; transition: opacity .12s; }
.bocadillo.on { opacity: 1; }
.leyenda { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); margin-top: 12px; }
.leyenda i { display: inline-block; width: 18px; border-top: 2px solid var(--accent); vertical-align: middle; margin-right: 7px; }
.leyenda i.ref { border-top: 2px dashed var(--ref); }

/* tablas */
.tabla { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 13px; padding: 9px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 6px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td:first-child { white-space: nowrap; }
.der { text-align: right; }
td.motivo { color: var(--ink-2); font-size: 13.5px; min-width: 220px; max-width: 380px; }
.compra { color: var(--up); font-weight: 500; } .venta { color: var(--down); font-weight: 500; }
.sube { color: var(--up); } .baja { color: var(--down); }

.vacio { color: var(--ink-3); font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.vacio svg.ico { margin-top: 2px; }
.nota { font-size: 13.5px; color: var(--ink-3); margin-top: 12px; max-width: 72ch; }
.aviso { background: var(--sim-soft); color: var(--sim); border-radius: var(--r-md); padding: 12px 14px; font-size: 14.5px; display: flex; gap: 10px; }
.error { background: var(--down-soft); color: var(--down); border-radius: var(--r-md); padding: 12px 14px; font-size: 14.5px; display: flex; gap: 10px; }
.cifras-lab { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14.5px; color: var(--ink-2); margin-bottom: 16px; }
.cifras-lab strong { color: var(--ink); font-weight: 600; }
.progreso { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin: 8px 0 4px; }
.progreso span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.inc { padding: 14px 0; border-top: 1px solid var(--line-2); display: grid; gap: 4px; }
.inc:first-of-type { border-top: 0; padding-top: 0; }
.inc .fila { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); }

details.plegable { border-top: 1px solid var(--line-2); }
details.plegable > summary { cursor: pointer; padding: 12px 0; font-weight: 500; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; }
details.plegable > summary::-webkit-details-marker { display: none; }
details.plegable > summary svg.ico { color: var(--ink-3); transition: transform .25s var(--ease); }
details.plegable[open] > summary svg.ico { transform: rotate(180deg); }
details.plegable > div { padding-bottom: 12px; }

.glosario { margin: 0; display: grid; gap: 0; }
.glosario div { padding: 14px 0; border-top: 1px solid var(--line-2); display: grid; gap: 4px; }
.glosario div:first-child { border-top: 0; padding-top: 0; }
.glosario dt { font-weight: 600; }
.glosario dd { margin: 0; color: var(--ink-2); max-width: 70ch; }

/* esqueleto y error de carga */
.esq { background: linear-gradient(90deg, var(--line-2) 0%, var(--line) 50%, var(--line-2) 100%); background-size: 200% 100%; border-radius: 10px; }
@media (prefers-reduced-motion: no-preference) { .esq { animation: brillo 1.4s ease-in-out infinite; } @keyframes brillo { to { background-position: -200% 0; } } }
#carga .esq { margin-bottom: 14px; }
#fallo[hidden], #carga[hidden], #app[hidden] { display: none; }
footer { max-width: 1160px; margin: 0 auto; padding: 0 16px 36px; color: var(--ink-3); font-size: 13.5px; }
</style>
</head>

  <symbol id="i-reloj" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-matraz" viewBox="0 0 24 24"><path d="M10 3.5h4M10.5 3.5v5L5.5 18a1.6 1.6 0 0 0 1.4 2.4h10.2a1.6 1.6 0 0 0 1.4-2.4l-5-9.5v-5"/><path d="M7.8 14.5h8.4"/></symbol>
  <symbol id="i-hucha" viewBox="0 0 24 24"><path d="M5 11.5a6 6 0 0 1 6-5h3a6 6 0 0 1 5.5 3.5H21v4h-1.6a6 6 0 0 1-2.4 2.6V19h-3v-1.5h-3V19H8v-2.4a6 6 0 0 1-3-5.1z"/><path d="M15.5 10.5v.2"/></symbol>
</svg>

<header class="cabecera">
  <div class="cab-in">
    <div class="marca"><span class="logo"><svg class="ico" viewBox="0 0 24 24"><path d="M5 16l5-5 3 3 6-7"/></svg></span>Panel del bot</div>
    <span class="frescura" id="frescura" aria-live="polite"></span>
    <button class="boton" id="recargar" type="button"><svg class="ico" aria-hidden="true"><use href="#i-actualizar"/></svg><span class="txt">Actualizar</span><span class="sr">datos</span></button>
  </div>
</header>

<nav class="nav" aria-label="Secciones">
  <div class="nav-in">
    <a href="#resumen" data-v="resumen"><svg class="ico" aria-hidden="true"><use href="#i-inicio"/></svg>Resumen</a>
    <a href="#etf" data-v="etf"><svg class="ico" aria-hidden="true"><use href="#i-etf"/></svg>ETF</a>
    <a href="#acciones" data-v="acciones"><svg class="ico" aria-hidden="true"><use href="#i-acciones"/></svg>Acciones</a>
    <a href="#cripto" data-v="cripto"><svg class="ico" aria-hidden="true"><use href="#i-cripto"/></svg>Cripto</a>
    <a href="#mas" data-v="mas"><svg class="ico" aria-hidden="true"><use href="#i-mas"/></svg>Más</a>
  </div>
</nav>

<main id="contenido" tabindex="-1">
  <div id="carga" aria-busy="true">
    <span class="sr" role="status">Cargando los datos del bot</span>
    <div class="esq" style="height:44px;width:min(560px,92%)"></div>
    <div class="esq" style="height:20px;width:min(420px,75%)"></div>
    <div class="esq" style="height:260px;width:100%;margin-top:30px;border-radius:18px"></div>
  </div>

  <div id="fallo" role="alert" hidden>
    <h1 class="titular" style="font-size:30px">No he podido leer los datos del bot.</h1>
    <p class="entradilla" id="fallo-texto">Puede que no haya conexión o que el bot aún no haya subido su primer informe.</p>
    <p style="margin-top:20px"><button class="boton" type="button" id="reintentar"><svg class="ico" aria-hidden="true"><use href="#i-actualizar"/></svg>Volver a intentarlo</button></p>
  </div>

  <div id="app" hidden>
    <div class="vista" id="v-resumen" hidden></div>
    <div class="vista" id="v-etf" hidden></div>
    <div class="vista" id="v-acciones" hidden></div>
    <div class="vista" id="v-cripto" hidden></div>
    <div class="vista" id="v-mas" hidden></div>
  </div>
</main>
<footer id="pie">Panel de solo lectura: no contiene claves ni permite controlar el bot.</footer>

<script>
(() => {
  "use strict";
  const URL_DATOS = "datos.json";
  const VISTAS = ["resumen", "etf", "acciones", "cripto", "mas"];
  const eur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
  const nf = (d) => new Intl.NumberFormat("es-ES", { maximumFractionDigits: d });
  const num = (v, d = 2) => (v == null || isNaN(v)) ? "—" : nf(d).format(v);
  const pct = (v, signo = true) => (v == null || isNaN(v)) ? "—" : (signo && v > 0 ? "+" : "") + nf(2).format(v) + " %";
  const euros = (v) => (v == null || isNaN(v)) ? "—" : eur.format(v);
  const clase = (v) => v > 0 ? "sube" : v < 0 ? "baja" : "";
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const enlace = (u) => /^https?:\/\//i.test(u || "") ? esc(u) : "#";
  const $ = (id) => document.getElementById(id);
  const ico = (n, extra = "") => `<svg class="ico" ${extra} aria-hidden="true"><use href="#i-${n}"/></svg>`;
  const vacio = (t) => `<p class="vacio">${ico("info")}<span>${esc(t)}</span></p>`;
  const aFecha = (s) => { if (!s) return null; const d = new Date(String(s).split(" ")[0].length <= 10 ? String(s) + "T12:00:00" : String(s).split(" ")[0]); return isNaN(d) ? null : d; };
  const fecha = (s) => { const d = aFecha(s); return d ? d.toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" }) : "—"; };
  const fechaHora = (s) => { const d = aFecha(s); return d ? d.toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—"; };
  const hace = (s) => {
    const d = aFecha(s); if (!d) return "";
    const min = Math.round((Date.now() - d) / 60000);
    if (min < 2) return "ahora mismo"; if (min < 60) return `hace ${min} min`;
    const h = Math.round(min / 60); if (h < 24) return `hace ${h} h`;
    const dias = Math.round(h / 24); return `hace ${dias} día${dias > 1 ? "s" : ""}`;
  };
  const NOMBRES_DIA = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];

  let datos = null;

  /* ---------------- carga ---------------- */
  async function cargar() {
    const b = $("recargar"); b.setAttribute("aria-busy", "true"); b.disabled = true;
    try {
      const r = await fetch(URL_DATOS + "?v=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("el servidor respondió " + r.status);
      datos = await r.json();
      $("carga").hidden = true; $("fallo").hidden = true; $("app").hidden = false;
      pintar(datos);
      mostrar(vistaDeHash(), false);
    } catch (e) {
      $("carga").hidden = true;
      if ($("app").hidden) { $("fallo").hidden = false; $("fallo-texto").textContent = `Puede que no haya conexión o que el bot aún no haya subido su primer informe (${e.message}).`; }
      else $("frescura").textContent = "No se pudo actualizar. Inténtalo de nuevo.";
    } finally { b.removeAttribute("aria-busy"); b.disabled = false; }
  }
  $("recargar").addEventListener("click", cargar);
  $("reintentar").addEventListener("click", () => { $("fallo").hidden = true; $("carga").hidden = false; cargar(); });

  /* ---------------- navegación ---------------- */
  const vistaDeHash = () => { const h = (location.hash || "").slice(1); return VISTAS.includes(h) ? h : "resumen"; };
  function mostrar(v, foco = true) {
    VISTAS.forEach(k => { $("v-" + k).hidden = k !== v; });
    document.querySelectorAll(".nav a").forEach(a => a.dataset.v === v ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
    graficos.forEach((args, c) => { if ($("v-" + v).contains(c)) dibujar(c, ...args); });
    if (foco) { window.scrollTo({ top: 0 }); $("contenido").focus({ preventScroll: true }); }
  }
  window.addEventListener("hashchange", () => mostrar(vistaDeHash()));

  /* ---------------- textos sobre el dinero ---------------- */
  function dinero(d) {
    if (d.modo === "REAL") return { real: true, etq: "Dinero real", corto: "real", frase: "con dinero real" };
    if (d.broker === "ibkr") return { real: false, etq: "Práctica de IBKR", corto: "simulado", frase: "con dinero simulado de la cuenta de práctica de Interactive Brokers" };
    return { real: false, etq: "Dinero simulado", corto: "simulado", frase: "con dinero simulado (el bróker de práctica del propio bot)" };
  }

  function pintar(d) {
    $("frescura").textContent = "Datos " + hace(d.generado);
    $("frescura").title = "Generados el " + fechaHora(d.generado);
    resumen(d);
    vistaEtf(d);
    ["acciones", "cripto"].forEach(m => vistaFicticia(m, d));
    vistaMas(d);
    $("pie").textContent = `Datos generados el ${fechaHora(d.generado)}. Panel de solo lectura: no contiene claves ni permite controlar el bot.`;
  }

  /* ---------------- RESUMEN ---------------- */
  function proximos() {
    const ahora = new Date();
    const siguiente = (dias, h, m) => {
      for (let i = 0; i < 8; i++) {
        const c = new Date(ahora); c.setDate(c.getDate() + i); c.setHours(h, m, 0, 0);
        if (dias.includes(c.getDay()) && c > ahora) return c;
      }
    };
    const fmt = (c) => {
      const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
      const dif = Math.round((new Date(c).setHours(0, 0, 0, 0) - hoy) / 864e5);
      const dia = dif === 0 ? "Hoy" : dif === 1 ? "Mañana" : NOMBRES_DIA[c.getDay()][0].toUpperCase() + NOMBRES_DIA[c.getDay()].slice(1);
      return [dia, c.toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" }) + " · " + c.toLocaleDateString("es-ES", { day: "numeric", month: "short" })];
    };
    return [
      [siguiente([1, 2, 3, 4, 5], 17, 15), "<strong>Ciclo de ETF.</strong> Mira los precios y, si la estrategia lo pide, compra o vende. Si la bolsa alemana está cerrada (festivo), no hace nada."],
      [siguiente([2, 3, 4, 5, 6], 7, 30), "<strong>Día de acciones y cripto.</strong> Avanza la bolsa ficticia y las estrategias en prueba con los precios de la víspera."],
      [siguiente([6], 10, 0), "<strong>Examen semanal.</strong> Inventa unas 40 ideas por mercado y las pone a prueba con datos del pasado."],
    ].filter(([c]) => c).sort((a, b) => a[0] - b[0]).map(([c, t]) => [fmt(c), t]);
  }

  function resumen(d) {
    const r = d.resumen || {}, din = dinero(d), F = d.ficticio || {}, M = F.mercados || {};
    const dec = (d.decisiones || [])[0];
    const objetivo = Object.entries(dec?.objetivo || {});
    const queEtf = (d.protecciones || []).length ? "Tiene una protección activa: solo puede vender."
      : Object.keys(d.posiciones || {}).length ? "Invertido y vigilando la tendencia."
      : objetivo.length && !objetivo.some(([s]) => s === "liquidez") ? `La estrategia quiere comprar ${objetivo.map(([s]) => s).join(" y ")} en el próximo ciclo.` : "En liquidez, esperando señal.";
    const filaFict = (m, nombre, icono) => {
      const x = M[m]; if (!x) return "";
      const b = x.bolsa || {}, empezo = (b.curva || []).length > 0;
      return `<li><a class="cartera" href="#${m}">
        <span class="icono">${ico(icono)}</span>
        <span><span class="nombre">${nombre} <span class="etq sim">Ficticio</span></span>
          <span class="que">${empezo ? `Sigue a: ${esc(x.lider?.nombre || "Comprar y no tocar")}` : "Empieza en el próximo día de mercado."}</span></span>
        <span class="cifra"><span class="v num">${euros(b.valor ?? x.capital)}</span> <span class="c num ${clase(b.rendimiento_pct)}">${pct(b.rendimiento_pct)}</span></span>
        ${ico("flecha")}</a></li>`;
    };
    const salud = [];
    const ciclo = d.ultimo_ciclo || "";
    salud.push(ciclo ? (ciclo.includes("error") ? `<p class="mal">${ico("alerta")}<span>El último ciclo (${esc(fechaHora(ciclo))}) terminó con un error. Mira los avisos.</span></p>`
      : `<p class="bien">${ico("bien")}<span>Último ciclo: ${esc(fechaHora(ciclo))}, sin errores.</span></p>`) : `<p class="neutro">${ico("info")}<span>Todavía no ha hecho ningún ciclo.</span></p>`);
    const ig = d.integridad || {};
    salud.push(ig.ok ? `<p class="bien">${ico("escudo")}<span>Registro de operaciones intacto: nadie ha tocado operaciones antiguas.</span></p>`
      : `<p class="mal">${ico("alerta")}<span>${esc(ig.mensaje || "Revisa el registro de operaciones.")}</span></p>`);
    const prot = d.protecciones || [];
    salud.push(prot.length ? `<p class="mal">${ico("alerta")}<span>${prot.length} protección${prot.length > 1 ? "es activas" : " activa"}: el bot solo puede vender o quedarse en liquidez.</span></p>`
      : `<p class="bien">${ico("bien")}<span>Ninguna protección activa.</span></p>`);
    const avisos = [...(d.eventos || []), ...((d.laboratorio || {}).eventos || [])].filter(e => e && e.mensaje)
      .sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))).slice(0, 6);

    $("v-resumen").innerHTML = `
      <div class="apertura">
        <div>
          <h1 class="titular">${din.real ? "El bot opera con dinero real en ETF." : "Ningún euro tuyo está invertido."}</h1>
          <p class="entradilla">${din.real
            ? "La cartera de ETF usa dinero real dentro de los límites que fijaste. Acciones y cripto siguen siendo solo una prueba con dinero ficticio."
            : `Todo lo que ves aquí es una simulación. El bot practica con ${euros(r.inicial)} de mentira en ETF y prueba ideas con ${euros(F.bolsa_ficticia)} ficticios en acciones y cripto. Solo podría usar dinero real si tú lo activas a mano.`}</p>
          <div class="etiquetas"><span class="etq ${din.real ? "mal" : "sim"}">${ico("hucha")}${esc(din.etq)} en ETF</span><span class="etq sim">${ico("matraz")}Acciones y cripto: ficticio</span></div>
        </div>
      </div>

      <section class="bloque" aria-labelledby="t-carteras">
        <h2 id="t-carteras">Tus carteras de prueba</h2>
        <p class="explica">Toca una para ver qué tiene, qué ha hecho y por qué.</p>
        <ul class="carteras superficie">
          <li><a class="cartera" href="#etf">
            <span class="icono">${ico("etf")}</span>
            <span><span class="nombre">ETF <span class="etq ${din.real ? "mal" : "sim"}">${esc(din.real ? "Real" : "Práctica")}</span></span><span class="que">${esc(queEtf)}</span></span>
            <span class="cifra"><span class="v num">${euros(r.valor)}</span> <span class="c num ${clase(r.rentabilidad_pct)}">${pct(r.rentabilidad_pct)}</span></span>
            ${ico("flecha")}</a></li>
          ${filaFict("acciones", "Acciones", "acciones")}
          ${filaFict("cripto", "Cripto", "cripto")}
        </ul>
      </section>

      <div class="dos mitad" style="margin-top:36px">
        <section class="superficie relleno" aria-labelledby="t-agenda">
          <h3 id="t-agenda">Lo próximo que hará el bot</h3>
          <ul class="agenda">${proximos().map(([[dia, hora], t]) => `<li><span class="cuando">${dia}<span>${esc(hora)}</span></span><span class="que">${t}</span></li>`).join("")}</ul>
          <p class="nota">Horas de España. Las lanza solo el portátil si está encendido y con la sesión iniciada.</p>
        </section>
        <section class="superficie relleno" aria-labelledby="t-salud">
          <h3 id="t-salud">Cómo está el bot</h3>
          <div class="salud">${salud.join("")}</div>
        </section>
      </div>

      <section class="bloque" aria-labelledby="t-avisos">
        <h2 id="t-avisos">Últimos avisos</h2>
        <div class="superficie relleno" style="margin-top:14px">
          ${avisos.length ? `<ul class="lista">${avisos.map(e => `<li><span>${esc(String(e.mensaje).split("\n")[0])}</span><span class="meta">${esc(fechaHora(e.fecha))}</span></li>`).join("")}</ul>`
            : vacio("Sin avisos por ahora.")}
        </div>
      </section>`;
  }

  /* ---------------- ETF ---------------- */
  function vistaEtf(d) {
    const r = d.resumen || {}, din = dinero(d), est = d.estrategia || {};
    const pos = Object.entries(d.posiciones || {});
    const dec = (d.decisiones || [])[0];
    const media = est.media_dias || 200, fija = Number(est.exposicion_minima_pct || 0);
    const regla = fija > 0
      ? `Siempre tiene el ${num(fija, 0)} % invertido en un ETF mundial. El otro ${num(100 - fija, 0)} % solo entra cuando el precio está por encima de su media de ${num(media, 0)} días (señal de que el mercado sube) y sale a liquidez cuando cae por debajo.`
      : `Invierte en un ETF mundial cuando su precio está por encima de su media de ${num(media, 0)} días (señal de que el mercado sube) y pasa a liquidez cuando cae por debajo.`;
    const objetivo = Object.entries(dec?.objetivo || {});
    const pide = objetivo.length ? objetivo.map(([s, w]) => `${num(w, 0)} % en ${esc(s)}`).join(" y ") : "todo en liquidez";
    const compraria = (dec?.rebalanceo || []).filter(t => t.mover);
    const senales = (dec?.activos || []).filter(a => a.rol === "riesgo" && a.distancia_media_pct != null).map(a => {
      const v = a.distancia_media_pct, ancho = Math.min(50, Math.abs(v) * 2.5);
      return `<div class="fila"><span class="num">${esc(a.simbolo)}</span>
        <span><span class="regla">${v >= 0 ? "Por encima" : "Por debajo"} de su media de ${num(media, 0)} días</span>
          <span class="medidor" role="img" aria-label="${esc(a.simbolo)}: ${pct(v)} respecto a la media"><span style="${v >= 0 ? `left:50%;width:${ancho}%;background:var(--up)` : `left:${50 - ancho}%;width:${ancho}%;background:var(--down)`}"></span><i></i></span></span>
        <span class="num ${clase(v)}">${pct(v)}</span></div>`;
    }).join("");
    const lab = d.laboratorio || {};

    $("v-etf").innerHTML = `
      <div class="apertura con-lado">
        <div>
          <h1 class="titular">La cartera de práctica tiene <span class="num">${euros(r.valor)}</span> ${din.real ? "" : "simulados"}</h1>
          <p class="entradilla">Empezó con ${euros(r.inicial)} ${esc(din.frase)}. ${pos.length ? "Ahora tiene " + pos.map(([s, q]) => `${num(q, 4)} participación${q === 1 ? "" : "es"} de ${esc(s)}`).join(" y ") + "." : "Ahora mismo no tiene nada comprado: todo está en liquidez."} ${din.real ? "" : "Tú no has puesto dinero."}</p>
          <div class="etiquetas"><span class="etq ${din.real ? "mal" : "sim"}">${ico("hucha")}${esc(din.etq)}</span><span class="etq">${d.broker === "ibkr" ? "Interactive Brokers" : "Bróker de práctica"}</span></div>
        </div>
        <dl class="datos">
          <dt>Ganancia o pérdida</dt><dd class="num ${clase(r.rentabilidad_pct)}">${pct(r.rentabilidad_pct)}</dd>
          <dt>Máximo alcanzado</dt><dd class="num">${euros(r.maximo)}</dd>
          <dt>Caída desde el máximo</dt><dd class="num ${clase(r.caida_desde_maximo_pct)}">${pct(r.caida_desde_maximo_pct)}</dd>
          <dt>Operaciones</dt><dd class="num">${num(r.num_operaciones, 0)}</dd>
          <dt>Comisiones pagadas</dt><dd class="num">${euros(r.comisiones)}</dd>
        </dl>
      </div>

      <div class="dos">
        <section class="superficie relleno" aria-labelledby="t-senal">
          <h3 id="t-senal">Qué quiere hacer la estrategia</h3>
          ${dec ? `<p style="margin-bottom:14px">Con los precios del ${esc(fecha(dec.fecha))} pide <strong>${pide}</strong>.${compraria.length ? ` Como ahora no lo tiene, en el próximo ciclo ${compraria.map(t => `${t.objetivo_pct > t.actual_pct ? "comprará" : "venderá"} ${esc(t.simbolo)}`).join(" y ")}${din.real ? "" : " con dinero simulado"}.` : " La cartera ya está como pide, así que no hace falta operar."}</p>
            <div class="senal">${senales}</div>` : vacio("El bot aún no ha tomado ninguna decisión. Aparecerá tras su primer ciclo.")}
          <p class="nota">${esc(regla)} Solo cambia de opinión el último día hábil de cada mes, para operar poco y pagar pocas comisiones.</p>
        </section>
        <section class="superficie relleno" aria-labelledby="t-valor">
          <h3 id="t-valor">Evolución del valor</h3>
          <div class="grafico" id="g-etf"></div>
        </section>
      </div>

      <section class="bloque" aria-labelledby="t-etf-ops">
        <h2 id="t-etf-ops">Operaciones</h2>
        <p class="explica">Todo lo que ha comprado y vendido${din.real ? "" : " con el dinero simulado"}, con su comisión y el motivo.</p>
        <div class="superficie relleno">${tablaOps(d.operaciones || [], "Todavía no ha hecho ninguna operación. La primera será en un ciclo de lunes a viernes a las 17:15.")}</div>
      </section>

      <section class="bloque" aria-labelledby="t-guardian">
        <h2 id="t-guardian">El guardián</h2>
        <p class="explica">Son las reglas fijas que revisan cada orden antes de enviarla. Bloquean, por ejemplo, las compras con comisiones de más del 3,5 % o las que llegan tras una caída del 15 %. Vender para ponerse a salvo nunca se bloquea.</p>
        <div class="dos mitad">
          <div class="superficie relleno"><h3>Protecciones</h3>
            ${(d.protecciones || []).length ? d.protecciones.map(t => `<p class="aviso" style="margin-bottom:8px">${ico("alerta")}<span>${esc(t)}</span></p>`).join("") : `<p class="vacio">${ico("bien")}<span>Ninguna activa: puede comprar y vender con normalidad.</span></p>`}
          </div>
          <div class="superficie relleno"><h3>Órdenes bloqueadas</h3>
            ${(d.bloqueadas || []).length ? `<ul class="lista">${d.bloqueadas.map(o => `<li><span><strong class="${o.lado === "COMPRA" ? "compra" : "venta"}">${o.lado === "COMPRA" ? "Compra" : "Venta"}</strong> de ${num(o.cantidad, 4)} ${esc(o.simbolo)} <span class="num">(${euros(o.importe)})</span></span><span>${esc(o.motivo)}</span><span class="meta">${esc(fechaHora(o.fecha))}</span></li>`).join("")}</ul>` : vacio("Ninguna hasta ahora.")}
          </div>
        </div>
      </section>

      ${laboratorioEtf(lab)}`;
    grafico($("g-etf"), (d.curva || []).map(p => ({ f: p.f, a: p.v })), { vacio: "La línea aparecerá cuando el bot lleve al menos dos días registrados." });
    (lab.incubando || []).forEach((e, i) => grafico($("g-inc-" + i), e.curva, { vacio: "La curva aparecerá tras unos días.", etqB: "la que manda" }));

  const ESTADOS = { rechazada: ["Rechazada", ""], en_espera: ["Aprobada · en espera", "ok"], incubando: ["En prueba", "acento"],
    descartada: ["Descartada tras la prueba", "sim"], campeona: ["Manda ahora", "ok"], retirada: ["Retirada", "sim"] };
  const ORIGEN = { hermes: "propuesta por Hermes", plantilla: "inventada por el bot", config: "la de config.json" };

  function laboratorioEtf(L) {
    if (!L || !L.activo) return "";

  function cifrasLab(pruebas, c) {
    return `<p class="cifras-lab">${[["Examinadas", pruebas || 0], ["Rechazadas", c.rechazada || 0], ["En prueba", c.incubando || 0], ["Esperando hueco", c.en_espera || 0], ["Han llegado a mandar", (c.campeona || 0) + (c.retirada || 0)]]

  function recientes(lista, lider = false) {
    lista = lista || [];
    return `<details class="plegable" style="margin-top:16px"><summary>Últimas ideas examinadas y por qué se rechazaron (${lista.length}) ${ico("abajo")}</summary><div>

        : vacio("Todavía no se ha examinado ninguna. El primer examen es el sábado a las 10:00.")}

  function tablaOps(ops, textoVacio, mini = false) {
    if (!ops.length) return vacio(textoVacio);
    return `<div class="tabla"${mini ? ' style="font-size:13px"' : ""}><table>
      <thead><tr><th scope="col">Fecha</th><th scope="col">Tipo</th><th scope="col">Valor</th><th scope="col" class="der">Cantidad</th><th scope="col" class="der">Precio</th><th scope="col" class="der">Importe</th><th scope="col" class="der">Comisión</th><th scope="col">Motivo</th></tr></thead>
      <tbody>${ops.map(o => `<tr><td>${esc(fecha(o.fecha))}</td><td class="${o.lado === "COMPRA" ? "compra" : "venta"}">${o.lado === "COMPRA" ? "Compra" : "Venta"}</td>

  /* ---------------- ACCIONES Y CRIPTO ---------------- */

      <div class="dos">

      <section class="bloque" aria-labelledby="t-${m}-lab">

        <div class="superficie relleno">

            <div class="inc">

              <details class="plegable"><summary>Qué hace y sus ${num((e.operaciones || []).length, 0)} operaciones ${ico("abajo")}</summary><div>
                <p style="margin-bottom:8px">${esc(e.descripcion)}</p>
                ${e.examen ? `<p class="nota" style="margin:0 0 8px">En el examen: ${pct(e.examen.cagr_fuera_pct)} al año en los datos que no había visto, frente a ${pct(e.examen.cagr_fuera_vigente_pct)} de la referencia.</p>` : ""}

  /* ---------------- MÁS ---------------- */

        <div class="superficie relleno">${t ? `<dl class="datos">

      </section>
      <section class="bloque" aria-labelledby="t-info">

            .map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}

    if (bt.con_tu_capital) grafico($("g-bt"), (bt.curva || []).map(p => ({ f: p.f, a: p.bot, b: p.ref })), { vacio: "Sin curva.", etqB: "no tocar" });

  function backtest(bt) {
    if (!bt || !bt.con_tu_capital) return `<section class="bloque"><h2>Prueba con el pasado</h2><div class="superficie relleno" style="margin-top:14px">${vacio("Aún no hay backtest. Se genera con «python ejecutar.py backtest» en el portátil.")}</div></section>`;
    const c = bt.con_tu_capital, b = c.bot || {}, r = c.comprar_y_mantener || {}, ic = bt.intervalo_confianza_bot || {};
    const filas = [["Valor final", euros(b.valor_final), euros(r.valor_final)], ["Ganancia media al año", pct(b.cagr_pct), pct(r.cagr_pct)], ["Peor caída", pct(b.caida_maxima_pct), pct(r.caida_maxima_pct)], ["Peor año", pct(b.peor_anio_pct), pct(r.peor_anio_pct)]];

          </div>
        </div>
        ${(bt.veredicto || []).length ? `<div class="superficie relleno" style="margin-top:16px"><h3>Conclusión</h3><ul class="lista">${bt.veredicto.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>` : ""}
      </section>`;
  }

  function informativo(inf) {
    const partes = [];
    const caja = (titulo, html) => `<details class="plegable"><summary>${esc(titulo)} ${ico("abajo")}</summary><div>${html}</div></details>`;
    const err = (x) => x && x.error ? `<p class="error">${ico("alerta")}<span>No se pudo cargar: ${esc(x.error)}</span></p>` : null;
    const cp = inf.copycat;
    if (cp !== undefined) partes.push(caja("Qué compran los grandes inversores (13F)", err(cp) || (Array.isArray(cp) && cp.length ? cp.map(i => `
      <p style="margin:0 0 8px"><strong>${esc(i.inversor)}</strong> · presentado el ${esc(fecha(i.presentado))}</p>
      <div class="tabla"><table><thead><tr><th scope="col">Empresa</th><th scope="col" class="der">Peso</th><th scope="col" class="der">Cambio</th></tr></thead>
      <tbody>${(i.posiciones || []).map(p => `<tr><td>${esc(p.empresa)}</td><td class="der num">${num(p.peso_pct)} %</td><td class="der">${esc(p.cambio)}</td></tr>`).join("")}</tbody></table></div>
      <p class="nota">${esc(i.aviso)}</p>`).join("") : vacio("Sin datos."))));
    const cg = inf.congreso;
    if (cg !== undefined) partes.push(caja("Operaciones declaradas en el Congreso de EE. UU.", err(cg) || (Array.isArray(cg) && cg.length ? `<ul class="lista">${cg.map(f => `
      <li><span>${esc(f.miembro)} <span class="meta">(${esc(f.distrito)})</span></span><span class="meta">${esc(fecha(f.fecha))} · <a href="${enlace(f.pdf)}" target="_blank" rel="noopener">ver la declaración</a></span></li>`).join("")}</ul><p class="nota">Se declaran hasta 45 días después de operar.</p>` : vacio("Sin datos."))));
    const nt = inf.noticias;
    if (nt !== undefined) partes.push(caja("Noticias", err(nt) || (Array.isArray(nt) && nt.length ? `<ul class="lista">${nt.map(n => `
      <li><a href="${enlace(n.enlace)}" target="_blank" rel="noopener">${esc(n.titulo)}</a><span class="meta">${esc(n.fuente)} · ${esc(fechaHora(n.fecha))}</span></li>`).join("")}</ul>` : vacio("Ningún titular con tus palabras clave."))));
    return (partes.join("") || vacio("Los módulos informativos están apagados.")) + (inf.actualizado ? `<p class="nota">Actualizado el ${esc(fechaHora(inf.actualizado))}.</p>` : "");
  }

  /* ---------------- gráfico de líneas (ratón, dedo y teclado) ---------------- */
  const graficos = new Map();
  let tRes;
  window.addEventListener("resize", () => { clearTimeout(tRes); tRes = setTimeout(() => graficos.forEach((args, c) => { if (c.isConnected && c.offsetParent) dibujar(c, ...args); }), 150); });
  document.addEventListener("toggle", (e) => { if (e.target.open) graficos.forEach((args, c) => { if (e.target.contains(c)) dibujar(c, ...args); }); }, true);
  function grafico(cont, serie, opc = {}) { if (!cont) return; graficos.set(cont, [serie, opc]); dibujar(cont, serie, opc); }
  function dibujar(cont, serie, opc = {}) {
    if (!serie || serie.length < 2) { cont.innerHTML = vacio(opc.vacio || "Sin datos."); return; }
    const W = Math.max(280, Math.round(cont.clientWidth || 720)), H = W < 520 ? 190 : 230, m = { t: 12, r: 8, b: 26, l: 50 };
    const vals = serie.flatMap(p => [p.a, p.b]).filter(v => v != null);
    let min = Math.min(...vals), max = Math.max(...vals);
    const pad = (max - min) * .08 || 1; min -= pad; max += pad;
    const x = (i) => m.l + i * (W - m.l - m.r) / (serie.length - 1);
    const y = (v) => m.t + (1 - (v - min) / (max - min)) * (H - m.t - m.b);
    const ruta = (k) => serie.map((p, i) => p[k] == null ? "" : `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join("");
    const lineasY = [], etqX = [];
    for (let i = 0; i <= 4; i++) { const v = min + (max - min) * i / 4; lineasY.push(`<line class="eje" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text class="etiq" x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${num(v, (max - min) < 20 ? 1 : 0)}</text>`); }
    const nx = Math.min(W < 520 ? 2 : 4, serie.length - 1);
    for (let i = 0; i <= nx; i++) { const k = Math.round(i * (serie.length - 1) / nx); const f = aFecha(serie[k].f); etqX.push(`<text class="etiq" x="${x(k)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === nx ? "end" : "middle"}">${f ? esc(f.toLocaleDateString("es-ES", { month: "short", year: "2-digit" })) : ""}</text>`); }
    const u = serie[serie.length - 1];
    cont.innerHTML = `<svg class="g" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${esc(`De ${num(serie[0].a)} a ${num(u.a)} euros entre ${fecha(serie[0].f)} y ${fecha(u.f)}. Usa las flechas para recorrer los valores.`)}">
      ${lineasY.join("")}${etqX.join("")}
      <path class="area" d="${ruta("a")}L${x(serie.length - 1)},${H - m.b}L${x(0)},${H - m.b}Z"/>
      ${serie.some(p => p.b != null) ? `<path class="linea ref" d="${ruta("b")}"/>` : ""}
      <path class="linea dibujar" d="${ruta("a")}"/>
      <line class="guia" y1="${m.t}" y2="${H - m.b}" x1="-10" x2="-10" visibility="hidden"/>
      <circle class="punto" r="4" cx="-10" cy="-10" visibility="hidden"/>
    </svg><div class="bocadillo" aria-hidden="true"></div>`;
    const svg = cont.querySelector("svg"), linea = svg.querySelector(".linea.dibujar");
    linea.style.setProperty("--l", linea.getTotalLength());
    const guia = svg.querySelector(".guia"), pt = svg.querySelector(".punto"), tip = cont.querySelector(".bocadillo");
    let idx = serie.length - 1;
    const ver = (i) => {
      idx = Math.max(0, Math.min(serie.length - 1, i)); const p = serie[idx];
      guia.setAttribute("x1", x(idx)); guia.setAttribute("x2", x(idx)); guia.setAttribute("visibility", "visible");
      pt.setAttribute("cx", x(idx)); pt.setAttribute("cy", y(p.a)); pt.setAttribute("visibility", "visible");
      const k = svg.getBoundingClientRect().width / W;
      tip.style.left = Math.min(Math.max(x(idx) * k, 70), svg.getBoundingClientRect().width - 70) + "px"; tip.style.top = (y(p.a) * k) + "px";
      tip.textContent = `${fecha(p.f)} · ${euros(p.a)}` + (p.b != null ? ` · ${opc.etqB || "no tocar"} ${euros(p.b)}` : "");
      tip.classList.add("on");
    };
    const ocultar = () => { tip.classList.remove("on"); guia.setAttribute("visibility", "hidden"); pt.setAttribute("visibility", "hidden"); };
    const desde = (e) => { const r = svg.getBoundingClientRect(); ver(Math.round(((e.clientX - r.left) * W / r.width - m.l) / ((W - m.l - m.r) / (serie.length - 1)))); };
    svg.addEventListener("pointermove", desde); svg.addEventListener("pointerdown", desde);
    svg.addEventListener("pointerleave", ocultar); svg.addEventListener("blur", ocultar);
    svg.addEventListener("focus", () => ver(idx));
    svg.addEventListener("keydown", (e) => {
      const paso = e.shiftKey ? 10 : 1, t = { ArrowLeft: idx - paso, ArrowRight: idx + paso, Home: 0, End: serie.length - 1 }[e.key];
      if (t !== undefined) { ver(t); e.preventDefault(); }
    });
  }

  setInterval(() => { if (datos) $("frescura").textContent = "Datos " + hace(datos.generado); }, 60000);
  cargar();
})();
</script>
</body>
</html>
